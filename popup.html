<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>臺灣民事實務工具</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap');

    :root {
      --blue: #004098;
      --blue-dark: #00265c;
      --rose: #e11d48;
      --rose-dark: #9f1239;
      --bg: #fafafa;
      --bg-panel: #f3f4f6;
      --border: #e5e7eb;
      --text: #1f2937;
      --text-muted: #6b7280;
    }

    * { box-sizing: border-box; }

    html {
      overflow-x: hidden;
    }

    body {
      font-family: 'Inter', 'Microsoft JhengHei', sans-serif;
      width: 420px; min-width: 420px; max-width: 420px;
      height: 600px; margin: 0;
      overflow: hidden; overflow-x: hidden;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column;
    }

    html.sidepanel,
    body.sidepanel {
      width: 100%; min-width: 0; max-width: none; height: 100vh;
    }

    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .uppercase { text-transform: uppercase; }

    .pin-btn {
      background: none; border: none; cursor: pointer;
      padding: 6px; border-radius: 6px;
      color: var(--text-muted); display: flex;
      align-items: center; justify-content: center;
      transition: color 0.2s, background 0.2s;
    }
    .pin-btn:hover { color: var(--text); background: var(--border); }
    .pin-btn.active { color: var(--blue); }
    .pin-btn.active:hover { color: var(--blue-dark); background: #dbeafe; }
    .pin-btn.active svg rect { fill: currentColor; opacity: 0.15; }
    .pin-btn.active svg line { stroke-width: 2.5; }

    /* ── Tab Bar ── */
    .tab-bar {
      display: flex; flex-direction: column; gap: 6px;
      padding: 8px 16px 6px; flex-shrink: 0;
    }
    .tab-bar-row1 {
      display: flex; align-items: center; gap: 8px;
    }
    .tab-switch {
      position: relative; height: 32px;
      background: #e5e7eb; border-radius: 999px; padding: 4px;
      display: flex; flex: 1; min-width: 0; overflow: hidden;
    }
    .tab-switch.inactive .tab-switch-thumb { opacity: 0; }
    .tab-row2-btn {
      width: 100%; height: 28px; border: 0; border-radius: 999px;
      background: #e5e7eb; color: var(--text-muted);
      font-size: 11px; font-weight: 700; cursor: pointer;
      transition: background 0.25s, color 0.25s;
    }
    .tab-bar-row2 {
      display: flex; gap: 6px;
    }
    .tab-bar-row2 .tab-row2-btn { flex: 1; }
    .tab-row2-btn.active {
      background: var(--blue); color: #fff;
    }
    .tab-switch-thumb {
      position: absolute; left: 4px; top: 4px;
      width: calc(33.333% - 3px); height: 24px;
      background: var(--blue); border-radius: 999px;
      transition: transform 0.3s; transform: translateX(0);
    }
    .tab-switch-thumb.pos1 { transform: translateX(100%); }
    .tab-switch-thumb.pos2 { transform: translateX(200%); }
    .tab-switch-text {
      position: relative; z-index: 1; flex: 1; text-align: center;
      font-size: 11px; font-weight: 700; line-height: 24px;
      padding: 0 4px; white-space: nowrap; transition: color 0.3s;
      user-select: none; cursor: pointer; overflow: hidden; text-overflow: ellipsis;
    }
    .tab-bar .spacer { flex: 0; }
    .tab-panel { display: none; flex: 1; flex-direction: column; overflow: hidden; min-height: 0; }
    .tab-panel.active { display: flex; }

    /* ── Tab 1: Calculator ── */
    main { padding: 8px 24px 0; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    footer {
      padding: 16px 24px; flex-shrink: 0;
      background: var(--bg-panel); border-top: 1px solid var(--border);
    }

    .label, .label-sm { font-weight: 700; color: var(--text-muted); }
    .label { font-size: 12px; }
    .label-sm { font-size: 11px; }
    .fee-header > span { font-size: 12px; font-weight: 700; color: var(--text); }

    textarea {
      width: 100%; height: 100%; padding: 12px;
      background: #fff; border: 2px solid var(--border); border-radius: 6px;
      font-size: 14px; line-height: 1.6; color: #374151;
      resize: none; outline: 0; transition: border-color 0.2s;
    }
    textarea:focus { border-color: var(--blue); }
    textarea::placeholder { color: #9ca3af; }

    .btn-text {
      font-size: 12px; font-weight: 600; border: 0; background: none;
      cursor: pointer; padding: 0; transition: color 0.2s;
    }
    .btn-rose { color: var(--rose); }
    .btn-rose:hover { color: var(--rose-dark); }
    .btn-muted { color: var(--text-muted); }
    .btn-muted:hover { color: var(--text); }
    .btn-blue { color: var(--blue); }
    .btn-blue:hover { color: var(--blue-dark); }
    .btn-action {
      height: 40px; padding: 0 12px; font-size: 12px; font-weight: 700;
      background: #fff; border: 1px solid #d1d5db; border-radius: 4px; cursor: pointer;
    }

    .tools-row {
      padding: 8px 24px 12px; flex-shrink: 0;
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .tools-buttons { display: flex; gap: 16px; padding-bottom: 8px; }
    .tools-result { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

    .result-display {
      font-size: 30px; font-weight: 700; color: var(--text); text-align: right;
      white-space: nowrap; overflow-x: auto; max-width: 100%;
    }
    .result-display.empty { color: #d1d5db; }
    .result-display::-webkit-scrollbar { display: none; }

    .fee-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 0 8px; margin-bottom: 4px;
      font-size: 12px; font-weight: 700; color: var(--text);
    }
    .fee-input-row { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .fee-actions { display: flex; gap: 4px; }
    .fee-cards { display: flex; gap: 16px; }

    .switch-container {
      position: relative; width: 192px; height: 32px;
      background: #e5e7eb; border-radius: 999px; padding: 4px;
      cursor: pointer; display: flex;
    }
    .switch-thumb {
      position: absolute; left: 4px; top: 4px;
      width: calc(50% - 4px); height: 24px;
      background: var(--blue); border-radius: 999px;
      transition: transform 0.3s; transform: translateX(100%);
    }
    .switch-text {
      position: relative; z-index: 1; flex: 1; text-align: center;
      font-size: 11px; font-weight: 700; line-height: 24px; transition: color 0.3s;
    }
    .active-text { color: #fff; }
    .inactive-text { color: var(--text-muted); }

    .input-group {
      flex: 1; display: flex; height: 40px;
      border: 1px solid #d1d5db; border-radius: 4px;
      background: #fff; overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-group:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 1px var(--blue);
    }
    .input-prefix {
      width: 36px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: #f9fafb; border-right: 1px solid var(--border);
      color: var(--text-muted); font-size: 15px;
    }
    .input-field {
      flex: 1; min-width: 0; border: 0; outline: 0;
      text-align: right; padding: 0 12px;
      font-size: 16px; font-weight: 600; background: transparent;
    }

    .fee-card {
      flex: 1; padding: 10px;
      background: #fff; border: 1px solid var(--border); border-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      display: flex; flex-direction: column;
    }
    .fee-card-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .fee-card .btn-text { font-size: 10px; font-weight: 700; }
    .fee-value { font-size: 20px; font-weight: 700; text-align: right; color: #d1d5db; }
    .fee-value.active { color: var(--text); }

    /* ── Tab 3: Date Calculator ── */
    .date-scroll {
      flex: 1; min-height: 0; overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .date-scroll::-webkit-scrollbar { width: 4px; }
    .date-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

    .d-section {
      flex-shrink: 0;
      padding: 10px 24px;
    }
    .d-section + .d-section {
      border-top: 1px solid var(--border);
    }
    .d-section-title {
      padding: 0 0 8px; font-size: 12px; font-weight: 700;
      color: var(--text);
      display: flex; align-items: center; justify-content: space-between;
    }
    .d-section-title .d-title-clear {
      font-size: 10px; font-weight: 700; border: none; background: none;
      color: var(--rose); cursor: pointer; padding: 0 2px;
      letter-spacing: 0; transition: color 0.15s;
    }
    .d-section-title .d-title-clear:hover { color: var(--rose-dark); }
    .d-section-body { display: flex; flex-direction: column; gap: 8px; }

    .d-row { display: flex; flex-direction: column; gap: 6px; }
    .d-row.inline { flex-direction: row; gap: 8px; align-items: center; }
    .d-field-group { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
    .d-field-group > label { font-size: 11px; font-weight: 700; color: var(--text-muted); }
    .d-field-group.row-inline {
      flex-direction: row; align-items: center; gap: 6px;
    }
    .d-field-group.row-inline > label { white-space: nowrap; margin-bottom: 0; }
    .d-field-group.row-inline > .d-input { flex: 1; }

    .d-input {
      display: flex; height: 32px;
      border: 1px solid #d1d5db; border-radius: 4px;
      background: #fff; overflow: hidden;
      transition: border-color 0.15s;
    }
    .d-input:focus-within { border-color: var(--blue); }
    .d-input input[type="text"] {
      flex: 1; min-width: 0; border: 0; outline: 0;
      padding: 0 8px; font-size: 13px; background: transparent;
      letter-spacing: 0.06em;
    }
    .d-input .d-cal {
      position: relative; width: 30px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border-left: 1px solid var(--border);
      color: var(--text-muted); cursor: pointer; transition: color 0.15s;
    }
    .d-input .d-cal:hover { color: var(--blue); background: #f0f4ff; }
    .d-input .d-cal input[type="date"] {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }
    .d-input .d-clr {
      width: 24px; flex-shrink: 0; border: 0; background: none;
      color: #d1d5db; cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.15s;
    }
    .d-input .d-clr:hover { color: var(--rose); }

    .d-small-btn {
      height: 32px; padding: 0 10px; font-size: 11px; font-weight: 700;
      background: #fff; border: 1px solid #d1d5db; border-radius: 4px;
      cursor: pointer; color: var(--text-muted); white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }
    .d-small-btn:hover { color: var(--blue); border-color: var(--blue); }
    .d-small-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .d-results {
      display: flex; flex-direction: column; gap: 1px;
      background: var(--border); border: 1px solid var(--border);
      border-radius: 4px; overflow: hidden;
    }
    .dr-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 10px; background: #fff; gap: 8px;
    }
    .dr-row.accent { background: #eff6ff; }
    .dr-label { font-size: 11px; font-weight: 700; color: var(--text-muted); white-space: nowrap; }
    .dr-val {
      font-size: 13px; font-weight: 700; color: var(--text); text-align: right;
      cursor: pointer; transition: color 0.15s; word-break: break-all;
    }
    .dr-val:hover { color: var(--blue); }
    .dr-val.placeholder { color: #d1d5db; cursor: default; }
    .dr-val.placeholder:hover { color: #d1d5db; }

    /* Age table */
    .age-table {
      display: flex; gap: 1px; background: var(--border);
      border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
    }
    .age-col {
      flex: 1; display: flex; flex-direction: column;
      background: #fff; padding: 6px; text-align: center; gap: 3px;
    }
    .age-header {
      font-size: 10px; font-weight: 700; color: var(--text-muted);
      white-space: nowrap;
    }
    .age-val {
      font-size: 12px; font-weight: 700; color: var(--text);
      cursor: pointer; transition: color 0.15s; white-space: nowrap;
    }
    .age-val:hover { color: var(--blue); }
    .age-val.placeholder { color: #d1d5db; cursor: default; }
    .age-val.placeholder:hover { color: #d1d5db; }

    .d-divider {
      display: flex; align-items: center; gap: 8px;
      padding-top: 2px;
    }
    .d-divider::before {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .d-divider-text {
      font-size: 11px; font-weight: 700; color: var(--text-muted);
      white-space: nowrap;
    }
    .d-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* Excluded period rows */
    .exc-row {
      display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
      padding: 5px 0; border-bottom: 1px solid #f3f4f6;
    }
    .exc-row:last-child { border-bottom: none; }
    .exc-num {
      width: 16px; text-align: right; font-size: 10px;
      font-weight: 700; color: var(--text-muted); flex-shrink: 0;
    }
    .exc-input {
      display: flex; height: 30px; flex: 1; min-width: 0;
      border: 1px solid #d1d5db; border-radius: 3px;
      background: #fff; overflow: hidden; transition: border-color 0.15s;
    }
    .exc-input:focus-within { border-color: var(--blue); }
    .exc-input input[type="text"] {
      flex: 1; min-width: 0; border: 0; outline: 0;
      padding: 0 6px; font-size: 12px; background: transparent;
      letter-spacing: 0.04em;
    }
    .exc-input .d-cal {
      position: relative; width: 26px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border-left: 1px solid var(--border);
      color: var(--text-muted); cursor: pointer; font-size: 10px;
    }
    .exc-input .d-cal:hover { color: var(--blue); }
    .exc-input .d-cal input[type="date"] {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }
    .exc-sep { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
    .exc-days {
      font-size: 11px; font-weight: 600; color: var(--text-muted);
      min-width: 40px; text-align: right; flex-shrink: 0;
    }
    .exc-del {
      width: 22px; height: 22px; border: 1px solid #e5e7eb;
      border-radius: 3px; background: #fff; color: var(--rose);
      font-size: 14px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .exc-del:hover { background: #fef2f2; }

    .exc-add-btn {
      width: 100%; height: 26px; border: 1px dashed #d1d5db;
      border-radius: 4px; background: none; cursor: pointer;
      font-size: 11px; font-weight: 700; color: var(--text-muted);
      transition: color 0.15s, border-color 0.15s;
    }
    .exc-add-btn:hover { color: var(--blue); border-color: var(--blue); }

    .exc-summary {
      display: flex; align-items: center; justify-content: flex-end;
      gap: 12px; padding: 4px 0 0; font-size: 11px;
    }
    .exc-summary-label { color: var(--text-muted); font-weight: 600; }
    .exc-summary-val { font-weight: 700; color: var(--rose); }

    /* Single-line result */
    .d-result-line {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 6px 10px; background: #fff;
      border: 1px solid var(--border); border-radius: 4px;
      min-height: 32px; overflow-x: auto;
    }
    .d-result-line::-webkit-scrollbar { height: 3px; }
    .d-result-line::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
    .d-result-line.accent { background: #eff6ff; border-color: #bfdbfe; }
    .d-result-line .dr-val { white-space: nowrap; font-size: 12px; }

    /* Direction toggle */
    .dir-bar {
      display: flex; border: 1px solid #d1d5db; border-radius: 4px;
      overflow: hidden;
    }
    .dir-bar.dir-bar-compact { flex-shrink: 0; }
    .dir-btn {
      flex: 1; padding: 7px 8px; font-size: 11px; font-weight: 700;
      text-align: center; border: none; cursor: pointer;
      background: #fff; color: var(--text-muted); transition: all 0.2s;
      white-space: nowrap;
    }
    .dir-btn:first-child { border-right: 1px solid #d1d5db; }
    .dir-btn.active { background: var(--blue); color: #fff; }

    /* Offset result */
    .offset-res {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; background: #eff6ff;
      border: 1px solid #bfdbfe; border-radius: 4px;
    }
    .offset-res-label { font-size: 11px; font-weight: 700; color: var(--blue); }
    .offset-res-val {
      font-size: 15px; font-weight: 700; color: var(--blue-dark);
      cursor: pointer;
    }
    .offset-res-val:hover { text-decoration: underline; }

    /* Copied flash */
    .flash-copied {
      font-size: 10px; font-weight: 700; color: #16a34a;
      margin-left: 4px; animation: fadeOut 1.5s forwards;
    }
    @keyframes fadeOut { 0%,60% { opacity: 1; } 100% { opacity: 0; } }

    /* ── Tab 2: Deadline Calculator ── */
    .dl-main {
      flex: 1; padding: 10px 24px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 8px;
    }
    .dl-main::-webkit-scrollbar { width: 4px; }
    .dl-main::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
    .dl-footer {
      flex-shrink: 0; padding: 10px 24px 12px;
      background: var(--bg-panel); border-top: 1px solid var(--border);
    }
    .dl-row { display: flex; flex-direction: column; gap: 4px; }
    .dl-row-inline { flex-direction: row; gap: 8px; align-items: flex-end; }
    .dl-field { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
    .dl-field > .label-sm { font-size: 11px; }

    .dl-select {
      height: 32px; line-height: 30px; flex: 1; min-width: 0;
      border: 1px solid #d1d5db; border-radius: 4px;
      background: #fff; padding: 0 28px 0 10px; font-size: 13px;
      color: var(--text); outline: 0; cursor: pointer;
      transition: border-color 0.15s;
      -webkit-appearance: none; appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236b7280' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 10px center;
    }
    .dl-select:focus { border-color: var(--blue); }

    .dl-switch {
      position: relative; height: 32px;
      background: #e5e7eb; border-radius: 999px; padding: 4px;
      display: flex;
    }
    .dl-switch-thumb {
      position: absolute; left: 4px; top: 4px;
      height: 24px; background: var(--blue); border-radius: 999px;
      transition: transform 0.3s, width 0.3s;
    }
    .dl-switch[data-count="2"] .dl-switch-thumb { width: calc(50% - 4px); }
    .dl-switch[data-count="3"] .dl-switch-thumb { width: calc(33.333% - 3px); }
    .dl-switch[data-count="4"] .dl-switch-thumb { width: calc(25% - 3px); }
    .dl-switch[data-count="2"] .dl-switch-thumb.pos1 { transform: translateX(100%); }
    .dl-switch[data-count="3"] .dl-switch-thumb.pos1 { transform: translateX(100%); }
    .dl-switch[data-count="3"] .dl-switch-thumb.pos2 { transform: translateX(200%); }
    .dl-switch[data-count="4"] .dl-switch-thumb.pos1 { transform: translateX(100%); }
    .dl-switch[data-count="4"] .dl-switch-thumb.pos2 { transform: translateX(200%); }
    .dl-switch[data-count="4"] .dl-switch-thumb.pos3 { transform: translateX(300%); }
    .dl-switch[data-count="5"] .dl-switch-thumb { width: calc(20% - 1.6px); }
    .dl-switch[data-count="5"] .dl-switch-thumb.pos1 { transform: translateX(100%); }
    .dl-switch[data-count="5"] .dl-switch-thumb.pos2 { transform: translateX(200%); }
    .dl-switch[data-count="5"] .dl-switch-thumb.pos3 { transform: translateX(300%); }
    .dl-switch[data-count="5"] .dl-switch-thumb.pos4 { transform: translateX(400%); }
    .dl-switch-item {
      position: relative; z-index: 1; flex: 1; min-width: 0; text-align: center;
      font-size: 11px; font-weight: 700; line-height: 24px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: color 0.3s;
      user-select: none; cursor: pointer; color: var(--text-muted);
      border: none; background: none; padding: 0 6px;
    }
    .dl-switch-item.active { color: #fff; }
    .dl-switch[data-count="5"] .dl-switch-item {
      font-size: 10px; padding: 0 2px; overflow: visible; text-overflow: unset;
    }

    .dl-period-grid {
      display: flex; gap: 1px; background: var(--border);
      border: 1px solid var(--border); border-radius: 4px;
      overflow: hidden; margin-bottom: 8px;
    }
    .dl-period-col {
      flex: 1; display: flex; flex-direction: column;
      background: #fff; padding: 6px; text-align: center; gap: 3px;
    }
    .dl-period-col.dl-period-total { background: #eff6ff; }
    .dl-period-label {
      font-size: 10px; font-weight: 700; color: var(--text-muted);
      white-space: nowrap;
    }
    .dl-period-val {
      font-size: 14px; font-weight: 700; color: var(--text);
    }

    .ic-foot {

    .ic-foot__acts .btn-action { height: 36px; font-size: 11px; }

    .ic-foot__acts .btn-action:disabled { opacity: 0.45; cursor: not-allowed; }
    .ic-foot__acts .btn-action.btn-rose {
      color: var(--rose); border-color: #fecdd3; background: #fff;
    }
    .ic-foot__acts .btn-action.btn-rose:hover {
      color: var(--rose-dark); border-color: var(--rose); background: #fff1f2;

    /* ── Tab 5: Depreciation (dep-) ── */
    #tabDepreciation { overflow-x: hidden; }
    .dep-wrap {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      overflow: hidden; overflow-x: hidden;
    }
    .dep-form {
      flex-shrink: 0; padding: 6px 16px 8px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .dep-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .dep-form .dl-field { gap: 3px; }
    .dep-meta {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; min-height: 20px;
    }
    .dep-meta .label-sm { margin: 0; flex-shrink: 0; }
    .dep-meta-val {
      font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono', monospace;
      color: var(--blue); text-align: right; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .dep-meta-val.placeholder { color: #d1d5db; font-weight: 600; }
    .dep-type-row {
      display: flex; align-items: center; gap: 6px; min-width: 0;
    }
    .dep-type-row .dl-switch { flex: 1; min-width: 0; }
    #depTypeSwitch[data-count="4"] .dl-switch-item { font-size: 10.5px; padding: 0 4px; }
    .dep-custom-inline {
      display: flex; align-items: center; gap: 4px; flex-shrink: 0;
    }
    .dep-custom-inline .d-input { width: 2.75rem; height: 32px; flex-shrink: 0; }
    .dep-custom-inline .d-input input {
      text-align: center; font-size: 13px; padding: 0 4px;
    }
    .dep-custom-inline .dep-yrs-suf {

    }
    .dep-cost-grid {

    }
    .dep-money.d-input .dep-money-pre {

    }
    .dep-money.d-input { display: flex; align-items: stretch; }
    .dep-money.d-input input {
      flex: 1; min-width: 0; border: 0; outline: 0; padding: 0 8px;

    }
    .dep-money.d-input input.dep-parts { color: var(--rose); }
    .dep-totals {
      display: flex; gap: 8px; padding: 8px 0 6px;
      border-top: 1px solid var(--border);
    }
    .dep-total-cell {
      flex: 1; display: flex; align-items: center; justify-content: space-between;
      gap: 6px; min-width: 0; min-height: 28px;
    }
    .dep-total-val {
      font-size: 13px; font-weight: 700; font-family: 'JetBrains Mono', monospace;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;

    .dep-total-val.accent { color: var(--blue); }
    .dep-foot {
      flex: 1; min-height: 0; display: flex; flex-direction: column;

      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 4px; flex-shrink: 0;
    }

<body>
  <!-- Tab Bar -->
  <nav class="tab-bar">
    <div class="tab-bar-row1">
      <div class="tab-switch" id="tabSwitch">

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>

        </svg>
      </button>
    </div>
    <div class="tab-bar-row2">
      <button type="button" class="tab-row2-btn" id="tabInterestBtn" data-tab="tabInterest">利息計算</button>
      <button type="button" class="tab-row2-btn" id="tabDepreciationBtn" data-tab="tabDepreciation">折舊計算</button>
    </div>
  </nav>

  <!-- ═══ Tab 1: 速算．裁判費 ═══ -->
  <div id="tabCalc" class="tab-panel active">
    <main>
      <textarea id="inputBox" placeholder="連續輸入數字或算式換行自動加總"></textarea>
    </main>

    <div class="tools-row">
      <div class="tools-buttons">
        <button id="copyEqBtn" class="btn-text btn-muted uppercase">複製算式</button>
        <button id="copyAnsBtn" class="btn-text btn-muted uppercase">複製結果</button>
        <button id="clearBtn" class="btn-text btn-rose uppercase">清除</button>
      </div>
      <div class="tools-result">
        <span class="label uppercase">總計金額</span>
        <div id="resultDisplay" class="result-display font-mono empty">0</div>
      </div>
    </div>

    <footer>
      <div class="fee-header">
        <span>裁判費試算</span>
        <div class="switch-container" id="feeToggleContainer">
          <div id="feeToggleThumb" class="switch-thumb"></div>

      <div class="fee-input-row">

        <div class="fee-actions">

          <button id="clearFeeBtn" class="btn-action btn-rose">清除</button>

      </div>

      <div class="fee-cards">
        <div class="fee-card">
          <div class="fee-card-header">
            <span class="label-sm uppercase">一審裁判費</span>
            <button id="copyFirstBtn" class="btn-text btn-blue">複製</button>
          </div>
          <span id="feeFirst" class="fee-value font-mono">0</span>
        </div>
        <div class="fee-card">
          <div class="fee-card-header">
            <span class="label-sm uppercase">上訴裁判費</span>

          </div>
          <span id="feeAppeal" class="fee-value font-mono">0</span>
        </div>
      </div>
    </footer>

          <select id="dlLocation" class="dl-select">
            <optgroup label="臺灣">
              <option value="臺北市">臺北市</option>
              <option value="新北市">新北市</option>
              <option value="基隆市">基隆市</option>
              <option value="宜蘭縣">宜蘭縣</option>
              <option value="桃園市">桃園市</option>
              <option value="新竹市">新竹市</option>
              <option value="新竹縣">新竹縣</option>
              <option value="苗栗縣">苗栗縣</option>
              <option value="臺中市">臺中市</option>
              <option value="彰化縣">彰化縣</option>
              <option value="南投縣">南投縣</option>
              <option value="雲林縣">雲林縣</option>
              <option value="嘉義市">嘉義市</option>
              <option value="嘉義縣">嘉義縣</option>
              <option value="臺南市">臺南市</option>
              <option value="高雄市">高雄市</option>
              <option value="屏東縣">屏東縣</option>
              <option value="花蓮縣">花蓮縣</option>
              <option value="臺東縣">臺東縣</option>
              <option value="澎湖縣">澎湖縣</option>
              <option value="金門縣">金門縣</option>
              <option value="連江縣">連江縣</option>
            </optgroup>
            <optgroup label="大陸或港澳地區">
              <option value="大陸或港澳">大陸或港澳地區</option>
            </optgroup>
            <optgroup label="國外">
              <option value="亞洲">亞洲</option>
              <option value="歐洲">歐洲</option>
              <option value="北美洲">北美洲</option>
              <option value="南美洲">南美洲</option>
              <option value="大洋洲">大洋洲</option>
              <option value="非洲">非洲</option>
            </optgroup>
          </select>
        </div>
        <div class="dl-field">
          <label class="label-sm">收受日</label>
          <div class="d-input">
            <input id="dlDate" type="text" class="font-mono" maxlength="8">
            <div class="d-cal" title="選擇日期">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <input type="date" tabindex="-1">
            </div>
          </div>
        </div>
      </div>
      <div style="text-align:right;">
        <button id="dlClearBtn" class="btn-text btn-rose" type="button" style="font-size:11px;font-weight:700;">清除</button>
      </div>

    </div>

    <footer class="dl-footer">
      <div class="dl-period-grid">
        <div class="dl-period-col">
          <span class="dl-period-label">不變期間</span>
          <span id="dlResA" class="dl-period-val placeholder font-mono">—</span>
        </div>
        <div class="dl-period-col">
          <span class="dl-period-label">在途期間</span>
          <span id="dlResB" class="dl-period-val placeholder font-mono">—</span>
        </div>
        <div class="dl-period-col">
          <span class="dl-period-label">送達生效</span>
          <span id="dlResC" class="dl-period-val placeholder font-mono">—</span>
        </div>
        <div class="dl-period-col dl-period-total">
          <span class="dl-period-label">總期間</span>
          <span id="dlResTotal" class="dl-period-val placeholder font-mono">—</span>
        </div>
      </div>
      <div class="dl-deadline">
        <div class="dl-deadline-row">
          <span class="dl-res-label">末日（未考慮假日）</span>
          <span id="dlResRaw" class="dl-res-val placeholder font-mono">—</span>
        </div>
        <div class="dl-deadline-row dl-deadline-final">
          <span class="dl-res-label">末日（已考慮假日）</span>
          <span id="dlResFinal" class="dl-res-val placeholder font-mono">—</span>
        </div>
      </div>
    </footer>
  </div>

  <!-- ═══ Tab 3: 日期計算 ═══ -->
  <div id="tabDate" class="tab-panel">
    <div class="date-scroll">

      <!-- Section 1: 日期區間計算 -->
      <div class="d-section">
        <div class="d-section-title"><span>日期區間計算</span><button id="dateRangeClear" class="d-title-clear" type="button">清除</button></div>
        <div class="d-section-body">
          <div class="d-row inline">
            <div class="d-field-group">
              <div class="d-input">
                <input id="dateStart" type="text" class="font-mono" maxlength="8" placeholder="起日">
                <div class="d-cal" title="選擇日期">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                  <input type="date" tabindex="-1">
                </div>
              </div>
            </div>
            <button id="dateStartTodayBtn" class="d-small-btn" title="起日設為今天">今日</button>
            <div class="d-field-group">
              <div class="d-input">
                <input id="dateEnd" type="text" class="font-mono" maxlength="8" placeholder="迄日">
                <div class="d-cal" title="選擇日期">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                  <input type="date" tabindex="-1">
                </div>
              </div>
            </div>
            <button id="dateTodayBtn" class="d-small-btn" title="迄日設為今天">今日</button>
          </div>

          <div class="d-result-line" id="dateResultLine">
            <span id="dateResultText" class="dr-val placeholder font-mono">—</span>
          </div>

          <!-- Excluded periods -->
          <div class="d-divider">
            <span class="d-divider-text">扣除區間</span>
          </div>
          <div id="excList"></div>
          <button id="excAddBtn" class="exc-add-btn" type="button">＋ 新增扣除區間</button>

          <div id="excSummary" class="exc-summary" style="display:none">
            <span class="exc-summary-label">扣除</span>
            <span id="excTotalDays" class="exc-summary-val font-mono">0日</span>
          </div>

          <div id="excResults" class="d-result-line accent" style="display:none">
            <span class="dr-label" style="flex-shrink:0">扣除後</span>
            <span id="netResultText" class="dr-val placeholder font-mono">—</span>
          </div>

        </div>
      </div>

      <!-- Section 2: 日期推算 -->
      <div class="d-section">
        <div class="d-section-title"><span>日期推算</span><button id="dateOffsetClear" class="d-title-clear" type="button">清除</button></div>
        <div class="d-section-body">
          <div class="d-row inline">
            <div class="d-field-group row-inline">
              <label>基準日</label>
              <div class="d-input">
                <input id="offBase" type="text" class="font-mono" maxlength="8">
                <div class="d-cal" title="選擇日期">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                  <input type="date" tabindex="-1">
                </div>
              </div>
            </div>
            <button id="offTodayBtn" class="d-small-btn" title="設為今天">今日</button>
            <div class="dir-bar dir-bar-compact">
              <button class="dir-btn active" data-dir="back" type="button">回推</button>
              <button class="dir-btn" data-dir="forward" type="button">起算</button>
            </div>
          </div>
          <div class="d-row inline">
            <div class="d-field-group row-inline">
              <label style="flex-shrink:0">期間</label>
              <div class="d-input"><input id="offYY" type="text" class="font-mono" maxlength="2" placeholder="年"></div>
              <div class="d-input"><input id="offMM" type="text" class="font-mono" maxlength="2" placeholder="月"></div>
              <div class="d-input"><input id="offDD" type="text" class="font-mono" maxlength="2" placeholder="日"></div>
            </div>
          </div>

          <div class="offset-res">
            <span class="offset-res-label">推算結果</span>
            <span id="offResult" class="offset-res-val font-mono">—</span>
          </div>
        </div>
      </div>

      <!-- Section 3: 年齡推算 -->
      <div class="d-section">
        <div class="d-section-title"><span>年齡推算</span><button id="dateAgeClear" class="d-title-clear" type="button">清除</button></div>
        <div class="d-section-body">
          <div class="d-field-group row-inline">
            <label>出生年月日</label>
            <div class="d-input">
              <input id="ageBirth" type="text" class="font-mono" maxlength="8">
              <div class="d-cal" title="選擇日期">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <input type="date" tabindex="-1">
              </div>
            </div>
          </div>

          <div class="age-table" id="ageResults">
            <div class="age-col">
              <span class="age-header">今日年齡</span>
              <span id="ageNow" class="age-val placeholder font-mono">—</span>
            </div>
            <div class="age-col">
              <span class="age-header" id="ageAdultLabel">成年日</span>
              <span id="ageAdult" class="age-val placeholder font-mono">—</span>
            </div>
            <div class="age-col">
              <span class="age-header">滿65歲日</span>
              <span id="age65" class="age-val placeholder font-mono">—</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- ═══ Tab 4: 利息計算 ═══ -->
  <div id="tabInterest" class="tab-panel">
    <div class="ic-wrap">
      <div class="ic-list" id="intGroups"></div>
      <footer class="ic-foot">
        <div class="ic-total">
          <div class="ic-total__cell">
            <span class="ic-total__lbl">總本金</span>
            <span id="intTotalA" class="ic-total__val ic-total__val--muted font-mono">$0</span>
          </div>
          <div class="ic-total__cell">
            <span class="ic-total__lbl">總利息</span>
            <span id="intTotalInt" class="ic-total__val ic-total__val--rose font-mono">$0</span>
          </div>
          <div class="ic-total__cell ic-total__cell--grand">
            <span class="ic-total__lbl">請求總額</span>
            <span id="intGrandTotal" class="ic-total__val ic-total__val--grand font-mono">$0</span>
          </div>
        </div>
        <div class="ic-foot__acts">
          <button type="button" id="intPrintBtn" class="btn-action" disabled>列印明細</button>
          <button type="button" id="intResetBtn" class="btn-action btn-rose">清除</button>
          <button type="button" id="intImportFeeBtn" class="btn-action primary" disabled>帶入裁判費</button>
        </div>
      </footer>
    </div>
  </div>

  <!-- ═══ Tab 5: 折舊計算 ═══ -->
  <div id="tabDepreciation" class="tab-panel">
    <div class="dep-wrap">
      <div class="dep-form">
        <div class="dep-row-2">
          <div class="dl-field">
            <label class="label-sm" for="depAcc">折舊基準日</label>
            <div class="d-input">
              <input id="depAcc" type="text" class="font-mono" maxlength="8">
              <div class="d-cal" title="選擇日期">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <input type="date" tabindex="-1">
              </div>
            </div>
          </div>
          <div class="dl-field">
            <label class="label-sm" for="depMfg">出廠年月</label>
            <div class="d-input">
              <input id="depMfg" type="text" class="font-mono" maxlength="8" placeholder="可輸入YYYYMM">
              <div class="d-cal" title="選擇日期">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <input type="date" tabindex="-1">
              </div>
            </div>
          </div>
        </div>

        <div class="dep-meta">
          <span class="label-sm">使用期間</span>
          <span id="depUsage" class="dep-meta-val placeholder font-mono">—</span>
        </div>

        <div class="dep-meta">
          <span class="label-sm">耐用年數/折舊率</span>
          <span id="depRate" class="dep-meta-val font-mono">5年 · 369‰</span>
        </div>

        <div class="dep-type-row">
          <div class="dl-switch" id="depTypeSwitch" data-count="4">
            <div class="dl-switch-thumb pos2"></div>
            <button type="button" class="dl-switch-item" data-val="motorcycle">機車</button>
            <button type="button" class="dl-switch-item" data-val="transport">運輸業車</button>
            <button type="button" class="dl-switch-item active" data-val="non-transport">非運輸業車</button>
            <button type="button" class="dl-switch-item" data-val="custom">自訂</button>
          </div>
          <div id="depCustomWrap" class="dep-custom-inline">
            <div class="d-input">
              <input id="depCustomYrs" type="text" class="font-mono" maxlength="2" inputmode="numeric">
            </div>
            <span class="dep-yrs-suf">年</span>
          </div>
        </div>

        <div class="dep-cost-grid">
          <div class="dl-field">
            <label class="label-sm" for="depParts" style="color:var(--rose)">零件（折舊）</label>
            <div class="d-input dep-money">
              <span class="dep-money-pre">$</span>
              <input id="depParts" type="text" class="font-mono dep-parts" inputmode="numeric">
            </div>
          </div>
          <div class="dl-field">
            <label class="label-sm" for="depLabor">工資</label>
            <div class="d-input dep-money">
              <span class="dep-money-pre">$</span>
              <input id="depLabor" type="text" class="font-mono" inputmode="numeric">
            </div>
          </div>
          <div class="dl-field">
            <label class="label-sm" for="depPaint">烤漆</label>
            <div class="d-input dep-money">
              <span class="dep-money-pre">$</span>
              <input id="depPaint" type="text" class="font-mono" inputmode="numeric">
            </div>
          </div>
          <div class="dl-field">
            <label class="label-sm" for="depMetal">鈑金</label>
            <div class="d-input dep-money">
              <span class="dep-money-pre">$</span>
              <input id="depMetal" type="text" class="font-mono" inputmode="numeric">
            </div>
          </div>
          <div class="dl-field" style="grid-column:1/-1">
            <label class="label-sm" for="depOther">其他</label>
            <div class="d-input dep-money">
              <span class="dep-money-pre">$</span>
              <input id="depOther" type="text" class="font-mono" inputmode="numeric">
            </div>
          </div>
        </div>

        <div class="dep-totals">
          <div class="dep-total-cell">
            <span class="label-sm">折舊前</span>
            <span id="depPreTotal" class="dep-total-val muted font-mono">$0</span>
          </div>
          <div class="dep-total-cell">
            <span class="label-sm">折舊後</span>
            <span id="depTotal" class="dep-total-val accent font-mono">$0</span>
          </div>
        </div>
      </div>
      <footer class="dep-foot">
        <div class="dep-foot-head">
          <span class="label-sm">書狀草稿（定率遞減法）</span>
          <div class="dep-foot-actions">
            <button type="button" id="depCopyBtn" class="btn-text btn-blue">複製</button>
            <button type="button" id="depResetBtn" class="btn-text btn-rose">清除</button>
          </div>
        </div>
        <textarea id="depDraft" spellcheck="false" ></textarea>
      </footer>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
